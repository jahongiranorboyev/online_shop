# HTTP orqali kelgan so‘rovlarni HTTPS ga yo'naltirish
server {
    listen 80;
    server_name shinam-makon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS konfiguratsiyasi
server {
    listen 443 ssl;
    server_name shinam-makon.uz;

    ssl_certificate /etc/letsencrypt/live/shinam-makon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shinam-makon.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static files
    location /static/ {
        alias /code/static/;
    }

    # Media files
    location /media/ {
        alias /code/media/;
    }

    # Django app (backend)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

